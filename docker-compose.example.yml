services:
  relay-agent:
    image: ghcr.io/gslabit/relay-agent:latest
    container_name: relay_agent
    restart: unless-stopped
    environment:
      GATEWAY_URL: wss://api.your-platform.com/agent/ws
      TOKEN: <paste-token-from-dashboard>
      DATA_ROOT_PATH: /data/tenants
      LOG_LEVEL: INFO
    volumes:
      # Docker socket — required for container management
      - /var/run/docker.sock:/var/run/docker.sock
      # Tenant data directory — must match DATA_ROOT_PATH
      - /data/tenants:/data/tenants
